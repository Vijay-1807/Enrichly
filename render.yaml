# Render Blueprint: one-click API + Postgres deploy.
# In Render: New → Blueprint → select this repo. Then deploy the web app on Vercel
# (see docs/DEPLOYMENT.md) and set FRONTEND_URL below to the Vercel URL.
services:
  - type: web
    name: enrichly-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: enrichly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://enrichly-web.vercel.app # ← replace with your Vercel URL, then redeploy
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Worker__PollIntervalSeconds
        value: 2
      - key: Worker__StaleTimeoutSeconds
        value: 120

databases:
  - name: enrichly-db
    databaseName: enrichly_jobs
    user: enrichly
    plan: free
