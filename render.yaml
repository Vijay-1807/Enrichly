# Render Blueprint: one-click API + Postgres deploy.
# FREE TIER: Both web service and Postgres use free plans ($0).
# Web spins down after 15 min idle (cold start ~30-60s).
# Postgres free tier expires after 30 days (recreate or upgrade before then).
# For Vercel deployment of the web frontend, see docs/DEPLOYMENT.md.
services:
  - type: web
    name: enrichly-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: enrichly-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://enrichly-web.vercel.app
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Worker__PollIntervalSeconds
        value: 2
      - key: Worker__StaleTimeoutSeconds
        value: 120

databases:
  - name: enrichly-db
    databaseName: enrichly_jobs
    user: enrichly
    plan: free
